[project]
name = "conclave"
version = "0.1.0"
description = "A small multi-agent runtime that investigates a question using repository, GitHub and web evidence."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
]

[project.scripts]
conclave = "conclave.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conclave"]
