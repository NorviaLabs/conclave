[project]
name = "conclave"
version = "0.1.0"
description = "A small multi-agent runtime that investigates a question using repository, GitHub and web evidence."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.0",
]

[project.scripts]
conclave = "conclave.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conclave"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov=conclave --cov-report=term-missing"

[tool.coverage.run]
source = ["conclave"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
