[project]
name = "conclave"
version = "0.1.0"
description = "A framework for building bounded multi-agent systems, plus the investigation app built on it."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
tools = [
    "ddgs>=9.16.0",
]

[project.scripts]
investigation = "investigation.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conclave", "investigation"]

[dependency-groups]
dev = [
    "ddgs>=9.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--cov=conclave --cov=investigation --cov-report=term-missing"

[tool.coverage.run]
source = ["conclave", "investigation"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
